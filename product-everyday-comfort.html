<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dash Apparel | Everyday Comfort Tee</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Outfit:wght@600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>
    <nav class="navbar navbar-expand-lg custom-navbar py-3">
      <div class="container">
        <a class="navbar-brand py-0" href="index.html">
          <img src="images/logo.png" alt="Dash Apparel Logo" class="navbar-logo">
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="index.html">HOME</a></li>
            <li class="nav-item"><a class="nav-link active" href="shop.html">SHOP</a></li>
            <li class="nav-item"><a class="nav-link" href="contact.html">CONTACT</a></li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <main class="container my-5">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">
        <div class="product-card p-4">
          <div>
            <img src="images/tee-everyday-comfort.png" alt="Everyday Comfort Graphic Tee" class="img-fluid">
            <h1 class="h3 mb-2">Everyday Comfort Tee</h1>
            <p class="h4 fw-bold mb-3">₱499.00</p>
            <p class="text-muted mb-4">
              An effortlessly soft, well-draped tee crafted for seamless everyday wear. Features premium lightweight cotton with a relaxed cut built to last.
            </p>

            <fieldset class="mb-4 text-center">
              <legend class="h6 fw-bold mb-2">SIZES</legend>
              <div class="btn-group" role="group" aria-label="Select shirt size">
                <input type="radio" class="btn-check" name="shirtSize" id="sizeS" value="S" checked>
                <label class="btn btn-outline-dark" for="sizeS">S</label>

                <input type="radio" class="btn-check" name="shirtSize" id="sizeM" value="M">
                <label class="btn btn-outline-dark" for="sizeM">M</label>

                <input type="radio" class="btn-check" name="shirtSize" id="sizeL" value="L">
                <label class="btn btn-outline-dark" for="sizeL">L</label>
              </div>
            </fieldset>

            <div class="d-flex justify-content-center align-items-center mb-4">
              <label for="shirtQty" class="fw-bold me-2 mb-0">Quantity:</label>
              <input type="number" id="shirtQty" value="1" min="1" max="10" class="form-control text-center" style="width: 80px;">
            </div>
          </div>

          <button type="button" class="btn btn-brand-dark py-2 fs-5" onclick="handleProductOrder('Everyday Comfort Tee', 499)">
            ORDER NOW
          </button>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <div class="container">
      <p class="mb-0">dash apparel | &copy; 2026 · <a href="privacy.html">PRIVACY</a> <a href="privacy.html">TERMS</a></p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
