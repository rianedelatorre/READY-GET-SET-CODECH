<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dash Apparel | Contact Us</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Outfit:wght@600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>
    <nav class="navbar navbar-expand-lg custom-navbar py-3">
      <div class="container">
        <a class="navbar-brand py-0" href="index.html">
          <img src="images/logo.png" alt="Dash Apparel Logo" class="navbar-logo">
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="index.html">HOME</a></li>
            <li class="nav-item"><a class="nav-link" href="shop.html">SHOP</a></li>
            <li class="nav-item"><a class="nav-link active" href="contact.html">CONTACT</a></li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <main>
    <section class="hero-banner my-4 container">
      <h1>GET IN TOUCH</h1>
      <p class="mb-0">We’d love to hear from you.</p>
    </section>

    <section class="container mb-5">
      <div class="row g-5">
        <div class="col-md-6">
          <h2 class="h3 mb-3">CUSTOMER SUPPORT</h2>
          <p class="fw-bold fs-5 mb-3">Email: hello@examplewebsite142.com</p>
          <p class="text-muted">We reply to order inquiries within 24 hours.</p>
        </div>

        <div class="col-md-6">
          <h2 class="h3 mb-3">SEND US A MESSAGE</h2>
          <form onsubmit="return handleContactSubmit(event)">
            <div class="mb-3">
              <label for="contactName" class="form-label fw-bold">Name</label>
              <input type="text" id="contactName" class="form-control" placeholder="Enter your full name." required>
            </div>
            
            <div class="mb-3">
              <label for="contactEmail" class="form-label fw-bold">Email</label>
              <input type="email" id="contactEmail" class="form-control" placeholder="Enter your email address." required>
            </div>
            
            <div class="mb-4">
              <label for="contactMessage" class="form-label fw-bold">Message</label>
              <textarea id="contactMessage" rows="4" class="form-control" placeholder="Type your message or order inquiry here." required></textarea>
            </div>
            
            <button type="submit" class="btn btn-brand-dark px-4 py-2" style="width: auto;">Send</button>
          </form>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <div class="container">
      <p class="mb-0">dash apparel | &copy; 2026 · <a href="privacy.html">PRIVACY</a> <a href="privacy.html">TERMS</a></p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
